name: Publish sandbox runtimes
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable runtime release version (for example 1.65.0-1)
        required: true
        type: string
permissions:
  actions: read
  contents: read
  packages: write
concurrency:
  group: sandbox-runtimes-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]'
      - name: Check policies and runtime unit tests
        run: |
          python3 packages/sandboxes/generate_seccomp.py --check
          python3 -m unittest discover -s packages/sandboxes -p 'test_*.py'
          cd packages/sandboxes/runtime
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build native runtime images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for kind in browser computer; do
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              -t "hostlier-sandbox-$kind:local" \
              -f "packages/sandboxes/runtime/Dockerfile.$kind" packages/sandboxes/runtime
          done
      - name: Exercise authenticated browser and desktop with production confinement
        run: python3 packages/sandboxes/smoke.py
      - name: Publish tested platform images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p digests
          for kind in browser computer; do
            image="ghcr.io/hostlier/sandbox-$kind"
            tag="$image:sha-$GITHUB_SHA-$ARCH"
            docker tag "hostlier-sandbox-$kind:local" "$tag"
            docker push "$tag"
            docker image inspect "$tag" --format '{{index .RepoDigests 0}}' > "digests/$kind-$ARCH.txt"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-digests-${{ matrix.arch }}
          path: digests/*.txt
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download platform references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'runtime-digests-*' --dir digests
      - name: Publish multiarch indexes and immutable metadata
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for kind in browser computer; do
            image="ghcr.io/hostlier/sandbox-$kind"
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "Release tag already exists; choose a new version." >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$image:$VERSION" \
              "$(cat digests/runtime-digests-amd64/$kind-amd64.txt)" \
              "$(cat digests/runtime-digests-arm64/$kind-arm64.txt)"
            docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' > "$kind-index.json"
          done
          python3 - <<'PY'
          import json, os
          images = {}
          for kind in ('browser', 'computer'):
              index = json.load(open(kind + '-index.json'))
              platforms = sorted(m['platform']['os'] + '/' + m['platform']['architecture'] for m in index['manifests'])
              assert platforms == ['linux/amd64', 'linux/arm64'], platforms
              images[kind] = 'ghcr.io/hostlier/sandbox-' + kind + '@' + index['digest']
          data = dict(version=1, release=os.environ['VERSION'], playwrightVersion='1.65.0', sourceRevision=os.environ['GITHUB_SHA'], platforms=['linux/amd64', 'linux/arm64'], images=images)
          with open('runtime-images.json', 'w') as f:
              f.write(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Tested runtime image references:\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-images
          path: runtime-images.json
